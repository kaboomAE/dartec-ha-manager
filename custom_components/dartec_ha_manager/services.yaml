allow_maintenance:
  name: "Baytec: allow maintenance"
  description: >-
    Let Baytec support perform sensitive operations in this home — locks,
    covers, alarm, climate, switches, scenes, automations, reboots and account
    changes —
    for a limited time. Only a Home Assistant administrator can allow it.
    Everything done during the window is written to your logbook. Closes
    automatically when it expires, and on any Home Assistant restart.
  fields:
    minutes:
      name: Duration
      description: How long the window stays open.
      default: 60
      selector:
        number:
          min: 1
          max: 480
          unit_of_measurement: minutes
          mode: box

complete_commissioning:
  name: "Baytec: commissioning complete"
  description: >-
    Mark the installation finished. Pairing lets Baytec perform sensitive
    operations while the home is being set up, for 30 days by default; this ends
    that now. Afterwards Baytec needs "Allow Baytec support" switched on again,
    or unattended support enabled in this integration's options. Only ends
    access — nothing can use it to extend or reopen commissioning.

end_maintenance:
  name: "Baytec: end maintenance"
  description: >-
    Close the maintenance window immediately. Routine monitoring continues;
    only sensitive operations stop being possible.
