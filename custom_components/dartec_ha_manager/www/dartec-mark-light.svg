<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Dartec">
  <title>Dartec</title>
  <!--
    Dartec — mark, FIXED LIGHT COLOURS.

    Ink #22251f · teal #1a6b6b. For cream, white and any light ground.

    No prefers-color-scheme block and no currentColor: these colours do not
    move. That is deliberate — the theme-aware masters one directory up
    follow the viewer's OS, which turns a light lockup pale-on-pale when it
    sits on a white page and the viewer's machine is dark. Use this set
    wherever you control the background.

    Geometry is fixed by docs/brand-guidelines.md §3 and generated by
    scripts/brand/build-fixed-svgs.mjs — never edit the paths by hand.
  -->
