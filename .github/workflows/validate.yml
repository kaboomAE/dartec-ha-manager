# Validation CI for the Dartec HA Manager agent.
#
# - hassfest: Home Assistant's own manifest/structure validation, always against
#   the CURRENT dev release — catches manifest schema drift.
# - HACS action: validates the repo is HACS-installable.
# - live: the agent from this commit, paired to a stub manager inside real
#   Home Assistant containers — see tests/live/run_live.py.
# - live-household: "My Home", the household panel, as several real people.
# - live-panels: room panel accounts, set up through the agent the way the
#   manager does and checked signed in as the panel itself - see
#   tests/live/run_live_panels.py.
# - live-dwains: Dwains Dashboard Next's Add card pop-up with the agent's
#   dashboard fix loaded and blocked, in Firefox and Chromium; the fix must
#   never change the errors, and must still make notifications readable in
#   dark mode — see tests/live/run_live_dwains.py (dartec-ha-manager#25).
# - live-brand: the brand's old spelling staged on a home (a stored default
#   theme under the old name, the entry title, a dashboard title) and put
#   right - see tests/live/run_live_brand.py.
# - live-dashboards: the test villa built from helpers, every dashboard in
#   docs/dashboards/prototypes applied through the agent and opened in
#   Chromium at phone, tablet, wall and NSPanel sizes in English and Arabic;
#   fails on a missing entity or a card error, and keeps the screenshots as
#   an artefact on every run - see tests/live/run_live_dashboards.py (#56).
# - live-update: guarded Core/OS updates inside real Home Assistant, with a
#   stand-in Supervisor; each update, rollback and restore really restarts
#   Home Assistant — see tests/live/run_live_update.py. About five minutes.
# - weekly schedule: HA ships monthly; the collector touches internals
#   (lovelace/system_log/hacs data, the device registry), so re-validating on a
#   schedule catches breakage even when we haven't pushed anything. Scheduled
#   and manual runs also put the live test against `stable` and `beta`, so a
#   new release breaking the agent shows up before a customer home takes it.

name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"  # weekly, Monday
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # brands wants the integration in home-assistant/brands, which has
          # not accepted custom integrations since Home Assistant 2026.3. The
          # icon comes from brand/ instead, so this ignore is permanent. HACS
          # shows that icon once it reads local brand images
          # (hacs/integration#5171).
          ignore: brands

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      # Only the pieces that carry no Home Assistant imports — enough to cover
      # the version comparison that decides whether a home gets overwritten
      # with older code.
      - run: python -m pytest tests -q

  live:
    # About 15 seconds a version once the image is pulled, and the pull is the
    # bulk of the job, so it runs on every push rather than only on a schedule.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 2026.8.3: the last release where iterating the device registry yields
        # ids. 2026.9.2: it yields entries, and mapping use is deprecated.
        version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["2026.8.3", "2026.9.2", "stable", "beta"]' || '["2026.8.3", "2026.9.2"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker pull -q ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
      - run: python tests/live/run_live.py ${{ matrix.version }} --artifacts live-artifacts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-${{ matrix.version }}
          path: live-artifacts
          if-no-files-found: ignore

  live-household:
    # "My Home", the household panel, driven as several real people in real
    # Home Assistant - see tests/live/run_live_household.py. About a minute a
    # version once the image is pulled.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["2026.8.3", "2026.9.2", "stable", "beta"]' || '["2026.8.3", "2026.9.2"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker pull -q ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
      - run: python tests/live/run_live_household.py ${{ matrix.version }} --artifacts live-artifacts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-household-${{ matrix.version }}
          path: live-artifacts
          if-no-files-found: ignore

  live-panels:
    # Room panel accounts: consent, the account, its own first dashboard and
    # hidden sidebar, status, update, removal, and My Home keeping them apart
    # - see tests/live/run_live_panels.py. About a minute and a half a version
    # once the image is pulled.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["2026.8.3", "2026.9.2", "stable", "beta"]' || '["2026.8.3", "2026.9.2"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker pull -q ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
      - run: python tests/live/run_live_panels.py ${{ matrix.version }} --artifacts live-artifacts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-panels-${{ matrix.version }}
          path: live-artifacts
          if-no-files-found: ignore

  live-dashboards:
    # The dashboards the fleet is given, rendered on each Home Assistant the
    # agent is tested on, so a release that breaks a card shows here before
    # homes take it. About eight minutes a version. The screenshots are
    # uploaded whether it passes or not: they are for a person to look at.
    # No timing is taken: headless Chromium shows no cost for what a wall
    # tablet's GPU pays for.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["2026.8.3", "2026.9.2", "stable", "beta"]' || '["2026.8.3", "2026.9.2"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      # Arabic has to be drawn in a real Arabic face, or every AR screenshot
      # is boxes. Noto is also what an Android wall tablet draws it in.
      - run: sudo apt-get install -y -q fonts-noto-core
      - run: docker pull -q ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
      - run: python tests/live/run_live_dashboards.py ${{ matrix.version }} --artifacts live-artifacts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-dashboards-${{ matrix.version }}
          path: live-artifacts
          if-no-files-found: ignore

  live-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["2026.8.3", "2026.9.2", "stable"]' || '["2026.9.2"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker pull -q ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
      - run: python tests/live/run_live_update.py ${{ matrix.version }} --artifacts live-artifacts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-update-${{ matrix.version }}
          path: live-artifacts
          if-no-files-found: ignore

  live-dwains:
    # The dashboard fix against the dashboard it fixes, in two real browsers -
    # see tests/live/run_live_dwains.py. Pinned to the versions the affected
    # home ran; scheduled runs add `stable` so a newer Home Assistant is tried
    # before homes take it. About three minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["2026.9.3", "stable"]' || '["2026.9.3"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium firefox
      - run: docker pull -q ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
      - run: python tests/live/run_live_dwains.py ${{ matrix.version }} --artifacts live-artifacts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-dwains-${{ matrix.version }}
          path: live-artifacts
          if-no-files-found: ignore

  live-brand:
    # The brand's old spelling, reported and put right, in real Home
    # Assistant - see tests/live/run_live_brand.py. About four minutes a
    # version: the rename rides the snapshot cadence.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["2026.8.3", "2026.9.2", "stable"]' || '["2026.8.3", "2026.9.2"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker pull -q ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
      - run: python tests/live/run_live_brand.py ${{ matrix.version }}
