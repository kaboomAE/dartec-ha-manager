---
# Dartec theme variants: DRAFTS for the owner's review (2026-09-25).
# Proposed for kaboomAE/dartec-theme; not shipped. Dartec's own designs: no
# file, value block or image is copied from another theme. See README.md in
# this folder for what inspired each variant and what it borrows.
#
# Every entry uses theme variables only: no card-mod, no JavaScript, no image
# files. Every text pair passes WCAG AA in both modes (contrast.md).
# Copper is not used anywhere: it is reserved for AI-generated content.
#
# Fonts: the families below render only where the fonts are loaded (see
# README.md, "Fonts"). Until then the stack falls back to system-ui/Roboto.

