# What Dartec's manager generates today for the bench's test rooms: the output of
# server/app/room_dashboards.py compile_room (manager main, commit 5935326), language ar,
# one view per room here; in a home each room is its own dartec-room-* dashboard.
title: المولد الحالي (غرف الاختبار)
views:
- title: المجلس
  path: majlis
  icon: mdi:door
  type: sections
  sections:
  - type: grid
    cards:
    - type: heading
      heading: الإضاءة
      icon: mdi:lightbulb-group
    - type: tile
      entity: light.majlis_chandelier
      features:
      - type: light-brightness
    - type: tile
      entity: light.majlis_downlights
      features:
      - type: light-brightness
    - type: tile
      entity: light.majlis_reading_lamp
      features:
      - type: light-brightness
    - type: tile
      entity: light.majlis_wall_washers
      features:
      - type: light-brightness
    - type: tile
      entity: light.d_lsqf_lmkhfy_hwl_lmjls_lryysy
      features:
      - type: light-brightness
  - type: grid
    cards:
    - type: heading
      heading: التكييف
      icon: mdi:thermostat
    - type: tile
      entity: climate.majlis_ac
      features:
      - type: target-temperature
    - type: tile
      entity: sensor.majlis_humidity
    - type: tile
      entity: sensor.majlis_temperature
  - type: grid
    cards:
    - type: heading
      heading: الستائر
      icon: mdi:blinds
    - type: tile
      entity: cover.majlis_curtains
      features:
      - type: cover-open-close
  - type: grid
    cards:
    - type: heading
      heading: المفاتيح
      icon: mdi:toggle-switch
    - type: tile
      entity: switch.aqara_wall_switch_h1_dual_left
    - type: tile
      entity: switch.aqara_wall_switch_h1_dual_right
    - type: tile
      entity: switch.sonoff_4chpror3_switch_1
    - type: tile
      entity: switch.sonoff_4chpror3_switch_2
    - type: tile
      entity: switch.sonoff_4chpror3_switch_3
    - type: tile
      entity: switch.sonoff_4chpror3_switch_4
